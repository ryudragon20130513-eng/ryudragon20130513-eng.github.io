<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AURA — 恋愛相性診断</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0a0f;
  --surface:#16101a;
  --surface2:#1e1525;
  --border:#2e2035;
  --accent:#c084fc;
  --accent2:#e879f9;
  --gold:#f0c060;
  --text:#f4eeff;
  --muted:#7c6d8a;
  --soft:#3d2e4a;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased;}

/* Grain overlay */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.6;}

/* Gradient orbs */
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
.orb1{width:400px;height:400px;background:radial-gradient(circle,rgba(192,132,252,.18),transparent 70%);top:-100px;left:-100px;}
.orb2{width:350px;height:350px;background:radial-gradient(circle,rgba(232,121,249,.12),transparent 70%);bottom:-80px;right:-80px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes scaleIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}

.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px 80px;position:relative;z-index:1;}

/* Logo */
.logo{text-align:center;margin-bottom:36px;animation:fadeUp .8s ease both;}
.logo-mark{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:300;letter-spacing:8px;background:linear-gradient(135deg,#c084fc,#e879f9,#f0c060);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 4s linear infinite;}
.logo-sub{font-size:10px;letter-spacing:4px;color:var(--muted);margin-top:6px;text-transform:uppercase;}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:32px 24px;width:100%;max-width:420px;animation:fadeUp .8s .1s ease both;backdrop-filter:blur(20px);}

/* Section divider */
.divider-line{display:flex;align-items:center;gap:12px;margin:20px 0;}
.divider-line::before,.divider-line::after{content:'';flex:1;height:1px;background:var(--border);}
.divider-text{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;}

/* Labels */
.field-label{font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:10px;text-transform:uppercase;display:block;}

/* Input */
.input-wrap{position:relative;margin-bottom:20px;}
input[type=text]{width:100%;padding:14px 18px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;font-size:15px;font-family:'Noto Sans JP',sans-serif;color:var(--text);outline:none;transition:border .2s,box-shadow .2s;}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(192,132,252,.12);}
input[type=text]::placeholder{color:var(--muted);}
.error-msg{color:#f87171;font-size:11px;margin-top:5px;display:none;letter-spacing:.5px;}

/* Relation selector */
.rel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
.rel-btn{padding:10px 8px;border-radius:12px;font-size:11px;font-weight:500;font-family:'Noto Sans JP',sans-serif;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--muted);transition:all .2s;text-align:center;letter-spacing:.5px;}
.rel-btn.on{border-color:var(--accent);background:rgba(192,132,252,.12);color:var(--accent);}

/* Trait chips */
.traits{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
.chip{padding:6px 13px;border-radius:99px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .2s;font-family:'Noto Sans JP',sans-serif;letter-spacing:.5px;}
.chip.on{border-color:var(--accent);background:rgba(192,132,252,.15);color:var(--accent);}

/* Main button */
.btn-main{width:100%;padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg,#7c3aed,#c084fc);color:white;font-size:14px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 32px rgba(124,58,237,.3);}
.btn-main:hover{transform:translateY(-1px);box-shadow:0 12px 40px rgba(124,58,237,.4);}
.btn-main:active{transform:translateY(0);}
.btn-main:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* Result */
.result-wrap{animation:scaleIn .6s cubic-bezier(.23,1,.32,1) both;}
.score-ring{width:160px;height:160px;margin:0 auto 20px;position:relative;}
.score-ring svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--surface2);stroke-width:8;}
.ring-fill{fill:none;stroke:url(#ringGrad);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.5s cubic-bezier(.23,1,.32,1);}
.score-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-number{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;color:var(--text);line-height:1;}
.score-unit{font-size:14px;color:var(--muted);letter-spacing:1px;}

/* Stars */
.stars-wrap{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--surface2);border-radius:14px;margin:16px 0;border:1px solid var(--border);}
.star-row{display:flex;align-items:center;gap:12px;}
.star-lbl{font-size:11px;color:var(--muted);letter-spacing:.5px;width:90px;flex-shrink:0;}
.stars-dots{display:flex;gap:4px;flex:1;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--soft);transition:background .3s,transform .2s;transition-delay:var(--d);}
.dot.on{background:linear-gradient(135deg,var(--accent),var(--accent2));}

/* Comment */
.verdict-tag{display:inline-block;padding:5px 14px;border-radius:99px;border:1px solid var(--accent);color:var(--accent);font-size:11px;letter-spacing:2px;margin:0 auto 14px;display:block;text-align:center;width:fit-content;margin:0 auto 14px;}
.comment{font-size:13px;color:var(--muted);line-height:1.8;text-align:center;padding:0 4px;margin-bottom:16px;}

/* Detail button */
.btn-detail{width:100%;padding:14px;border-radius:14px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:all .2s;margin-top:10px;}
.btn-detail:hover{background:rgba(192,132,252,.1);}
.btn-reset{width:100%;padding:12px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-family:'Noto Sans JP',sans-serif;cursor:pointer;margin-top:8px;transition:all .2s;}
.btn-reset:hover{border-color:var(--muted);}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(12px);z-index:100;display:flex;align-items:flex-end;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:28px 28px 0 0;padding:28px 22px 52px;width:100%;max-width:480px;margin:0 auto;max-height:88vh;overflow-y:auto;animation:slideUp .4s cubic-bezier(.23,1,.32,1);}
.modal-handle{width:32px;height:3px;background:var(--border);border-radius:99px;margin:0 auto 24px;}
.modal-score-head{text-align:center;margin-bottom:24px;}
.modal-title-big{font-family:'Cormorant Garamond',serif;font-size:54px;font-weight:300;color:var(--text);}
.modal-badge{display:inline-block;padding:4px 16px;border-radius:99px;border:1px solid var(--gold);color:var(--gold);font-size:10px;letter-spacing:2px;margin-top:8px;}

/* Modal sections */
.m-sec{padding:16px 18px;background:var(--surface2);border-radius:16px;margin-bottom:10px;border:1px solid var(--border);}
.m-sec-title{font-size:10px;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
.m-sec-body{font-size:13px;color:#b8a8cc;line-height:1.9;}
.m-list-item{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start;}
.m-marker{flex-shrink:0;font-size:13px;}

.loading-wrap{text-align:center;padding:60px 0;}
.loading-ring{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px;}
.loading-txt{font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}

.footer-txt{margin-top:20px;font-size:10px;letter-spacing:2px;color:#3d2e4a;text-transform:uppercase;}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--soft);border-radius:99px;}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<svg width="0" height="0">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
</svg>

<div class="page">
  <div class="logo">
    <div class="logo-mark">AURA</div>
    <div class="logo-sub">AI Love Compatibility</div>
  </div>

  <div class="card">

    <!-- FORM -->
    <div id="form-section">
      <div style="margin-bottom:20px">
        <span class="field-label">Relationship Status</span>
        <div class="rel-grid" id="rel-grid">
          <button class="rel-btn on" data-v="片思い" onclick="selRel(this)">片思い</button>
          <button class="rel-btn" data-v="付き合っている" onclick="selRel(this)">付き合っている</button>
          <button class="rel-btn" data-v="友達" onclick="selRel(this)">友達</button>
          <button class="rel-btn" data-v="秘密の恋" onclick="selRel(this)">秘密の恋</button>
        </div>
      </div>

      <span class="field-label">Your Name</span>
      <div class="input-wrap">
        <input type="text" id="name1" placeholder="あなたの名前">
        <div class="error-msg" id="err1">お名前を入力してください</div>
      </div>
      <span class="field-label">Your Personality</span>
      <div class="traits" id="traits1"></div>

      <div class="divider-line"><span class="divider-text">×</span></div>

      <span class="field-label">Their Name</span>
      <div class="input-wrap">
        <input type="text" id="name2" placeholder="相手の名前">
        <div class="error-msg" id="err2">相手のお名前を入力してください</div>
      </div>
      <span class="field-label">Their Personality</span>
      <div class="traits" id="traits2"></div>

      <button class="btn-main" id="submit-btn" onclick="doSubmit()">Analyze Compatibility</button>
    </div>

    <!-- RESULT -->
    <div id="result-section" style="display:none">
      <div class="result-wrap">
        <div style="text-align:center;font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:16px;text-transform:uppercase" id="result-names"></div>

        <!-- Ring -->
        <div class="score-ring">
          <svg viewBox="0 0 160 160" width="160" height="160">
            <circle class="ring-bg" cx="80" cy="80" r="68"/>
            <circle class="ring-fill" id="ring-fill" cx="80" cy="80" r="68"
              stroke-dasharray="427" stroke-dashoffset="427"/>
          </svg>
          <div class="score-center">
            <div class="score-number" id="score-display">0</div>
            <div class="score-unit">%</div>
          </div>
        </div>

        <!-- Stars -->
        <div class="stars-wrap">
          <div class="star-row">
            <div class="star-lbl">会話の弾み</div>
            <div class="stars-dots" id="dots-talk"></div>
          </div>
          <div class="star-row">
            <div class="star-lbl">価値観の近さ</div>
            <div class="stars-dots" id="dots-value"></div>
          </div>
          <div class="star-row">
            <div class="star-lbl">胸キュン度</div>
            <div class="stars-dots" id="dots-thrill"></div>
          </div>
        </div>

        <div class="verdict-tag" id="verdict-tag" style="display:none"></div>
        <div class="comment" id="comment"></div>

        <button class="btn-detail" onclick="openModal()">詳細を見る — Detail</button>
        <button class="btn-reset" onclick="doReset()">もう一度診断する</button>
      </div>
    </div>
  </div>

  <div class="footer-txt">For Entertainment Purposes Only</div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modal" style="display:none" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-score-head">
      <div style="font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:4px" id="modal-names"></div>
      <div class="modal-title-big" id="modal-score-txt"></div>
      <div class="modal-badge" id="modal-badge" style="display:none"></div>
    </div>
    <div id="modal-body">
      <div class="loading-wrap">
        <div class="loading-ring"></div>
        <div class="loading-txt">Analyzing</div>
      </div>
    </div>
  </div>
</div>

<script>
const NTFY="lm-ryuku-secret-8821";
const TRAITS=["明るい","内向的","優しい","真面目","おもしろい","クール","天然","頑固","素直","甘えん坊","しっかり者","マイペース","感情的","論理的","情熱的","穏やか"];
let sel1=[],sel2=[],score=0,relation="片思い";

function mkChips(id,arr){
  const el=document.getElementById(id);
  TRAITS.forEach(t=>{
    const b=document.createElement('button');
    b.className='chip';b.textContent=t;
    b.onclick=()=>{const i=arr.indexOf(t);if(i>=0){arr.splice(i,1);b.classList.remove('on');}else{arr.push(t);b.classList.add('on');}};
    el.appendChild(b);
  });
}
mkChips('traits1',sel1);mkChips('traits2',sel2);

function selRel(btn){document.querySelectorAll('.rel-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');relation=btn.dataset.v;}

function hashScore(n1,n2){
  const key=[n1,n2].sort().join('|');let h=0;
  for(let i=0;i<key.length;i++){h=((h<<5)-h)+key.charCodeAt(i);h|=0;}
  return 30+Math.abs(h)%61;
}

function dotScores(s){
  const b=s/20;
  return{
    talk:Math.min(5,Math.max(1,Math.round(b+Math.sin(s*7)*1.2))),
    value:Math.min(5,Math.max(1,Math.round(b+Math.cos(s*11)*.8))),
    thrill:Math.min(5,Math.max(1,Math.round(b+Math.sin(s*13)*1.5)))
  };
}

function renderDots(id,count){
  const el=document.getElementById(id);el.innerHTML='';
  for(let i=1;i<=5;i++){
    const d=document.createElement('div');
    d.className='dot'+(i<=count?' on':'');
    d.style.setProperty('--d',(i*.08)+'s');
    el.appendChild(d);
  }
}

async function doSubmit(){
  const n1=document.getElementById('name1').value.trim();
  const n2=document.getElementById('name2').value.trim();
  document.getElementById('err1').style.display='none';
  document.getElementById('err2').style.display='none';
  let ok=true;
  if(!n1){document.getElementById('err1').style.display='block';ok=false;}
  if(!n2){document.getElementById('err2').style.display='block';ok=false;}
  if(!ok)return;

  const btn=document.getElementById('submit-btn');
  btn.disabled=true;
  btn.innerHTML='<div style="width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .8s linear infinite"></div>';

  score=hashScore(n1,n2);
  sendNotify(n1,sel1,n2,sel2,score,relation);
  await new Promise(r=>setTimeout(r,1600));

  document.getElementById('form-section').style.display='none';
  document.getElementById('result-section').style.display='block';
  document.getElementById('result-names').textContent=`${n1}  ×  ${n2}`;

  // Animate ring
  const circumference=427;
  const offset=circumference-(circumference*score/100);
  setTimeout(()=>{document.getElementById('ring-fill').style.strokeDashoffset=offset;},100);

  // Count up score
  let cur=0;
  const step=()=>{cur+=1.2;if(cur>=score)cur=score;document.getElementById('score-display').textContent=Math.round(cur);if(cur<score)requestAnimationFrame(step);};
  setTimeout(()=>requestAnimationFrame(step),200);

  // Dots
  const ds=dotScores(score);
  setTimeout(()=>{renderDots('dots-talk',ds.talk);renderDots('dots-value',ds.value);renderDots('dots-thrill',ds.thrill);},800);

  // Comment
  const comments=[
    [85,'運命の出会いかもしれない。距離を縮める勇気を。'],
    [75,'確かな手応えがある。もう少し踏み込んでみて。'],
    [60,'可能性は十分にある。焦らず、自然体で。'],
    [45,'お互いを知る時間が必要。まずは友達から。'],
    [0,'違いを乗り越えることが二人の成長になる。']
  ];
  const c=comments.find(([t])=>score>=t);
  document.getElementById('comment').textContent=c[1];
}

async function openModal(){
  const n1=document.getElementById('name1').value.trim();
  const n2=document.getElementById('name2').value.trim();
  document.getElementById('modal-names').textContent=`${n1}  ×  ${n2}`;
  document.getElementById('modal-score-txt').textContent=score+'%';
  document.getElementById('modal-badge').style.display='none';
  document.getElementById('modal-body').innerHTML=`<div class="loading-wrap"><div class="loading-ring"></div><div class="loading-txt">Analyzing</div></div>`;
  document.getElementById('modal').style.display='flex';

  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:1200,
        messages:[{role:"user",content:`あなたは恋愛相性診断の専門AIです。以下の情報をもとに、リアルで読み応えのある詳細レポートをJSONのみで出力してください（\`\`\`不要）。

名前1: ${n1} / 性格: ${sel1.join('、')||'不明'}
名前2: ${n2} / 性格: ${sel2.join('、')||'不明'}
関係性: ${relation} / スコア: ${score}%

ルール：
- nameMatch: 名前の響き・対比から相性分析（2〜3文、名前を使って具体的に）
- personalityMatch: 性格の組み合わせ分析（3〜4文、「${n1}が〜、${n2}が〜」と名前を使って）
- strengths: 具体的なシーンが浮かぶ強み3つ（各1〜2文）
- cautions: やさしい口調の注意点2つ
- date: ぴったりなデートプラン（1〜2文）
- advice: スコアと関係性（${relation}）に触れた前向きなアドバイス（2〜3文）
- verdict: キャッチコピー一言

{"nameMatch":"","personalityMatch":"","strengths":["","",""],"cautions":["",""],"date":"","advice":"","verdict":""}`}]
      })
    });
    const d=await res.json();
    const a=JSON.parse(d.content[0].text.replace(/```json|```/g,'').trim());
    document.getElementById('modal-badge').textContent=a.verdict;
    document.getElementById('modal-badge').style.display='inline-block';
    document.getElementById('modal-body').innerHTML=`
      ${ms('NAME','名前の相性',a.nameMatch)}
      ${ms('CHARACTER','性格の相性',a.personalityMatch)}
      <div class="m-sec">
        <div class="m-sec-title" style="color:#4ade80">STRENGTHS — 二人の強み</div>
        ${a.strengths.map(s=>`<div class="m-list-item"><span class="m-marker" style="color:#4ade80">+</span><span class="m-sec-body">${s}</span></div>`).join('')}
      </div>
      <div class="m-sec">
        <div class="m-sec-title" style="color:#fb923c">CAUTION — 気をつけること</div>
        ${a.cautions.map(c=>`<div class="m-list-item"><span class="m-marker" style="color:#fb923c">△</span><span class="m-sec-body">${c}</span></div>`).join('')}
      </div>
      ${ms('DATE PLAN','おすすめデート',a.date,'#f0c060')}
      ${ms('ADVICE','AIからのアドバイス',a.advice,'var(--accent)')}
      <button onclick="closeModal()" style="width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-family:'Noto Sans JP',sans-serif;cursor:pointer;margin-top:4px">Close</button>
    `;
  }catch{
    document.getElementById('modal-body').innerHTML=`
      ${ms('NAME','名前の相性',`${n1}と${n2}の名前は音の響きが調和し、自然な引力があります。`)}
      ${ms('CHARACTER','性格の相性','二人の性格は互いの不足を補い合える関係。一緒にいることで本来の自分より少し良いバージョンになれます。')}
      <button onclick="closeModal()" style="width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-family:'Noto Sans JP',sans-serif;cursor:pointer">Close</button>
    `;
  }
}

function ms(en,ja,body,c='var(--accent)'){
  return `<div class="m-sec"><div class="m-sec-title" style="color:${c}">${en} — ${ja}</div><div class="m-sec-body">${body}</div></div>`;
}

function closeModal(){document.getElementById('modal').style.display='none';}

function doReset(){
  document.getElementById('form-section').style.display='block';
  document.getElementById('result-section').style.display='none';
  document.getElementById('name1').value='';document.getElementById('name2').value='';
  sel1.length=0;sel2.length=0;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  document.querySelectorAll('.rel-btn').forEach(b=>b.classList.remove('on'));
  document.querySelector('.rel-btn').classList.add('on');relation='片思い';
  const btn=document.getElementById('submit-btn');
  btn.disabled=false;btn.textContent='Analyze Compatibility';
}

function sendNotify(n1,t1,n2,t2,s,rel){
  const s1=t1.join('・')||'未入力',s2=t2.join('・')||'未入力';
  const title=encodeURIComponent(`💘 ${n1} × ${n2} → ${s}%`);
  const msg=encodeURIComponent(`${rel}\n${n1}（${s1}）× ${n2}（${s2}）`);
  fetch(`https://ntfy.sh/${NTFY}/publish?title=${title}&message=${msg}&priority=high&tags=heart`,{method:'GET',mode:'no-cors'}).catch(()=>{});
}
</script>
